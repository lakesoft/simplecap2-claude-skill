name: Close external PRs
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    # Skip when the PR author is the repo owner (lakesoft).
    if: ${{ github.event.pull_request.user.login != 'lakesoft' }}
    steps:
      - name: Comment and close
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "Thanks for your interest in this plugin!",
                "",
                "This repository is **distribution-only** — pull requests are not",
                "accepted. If you have feedback or want to suggest a change, please",
                "open an issue on the upstream SimpleCap2 project, or contact the",
                "author directly.",
                "",
                "Closing automatically. Sorry for the inconvenience."
              ].join("\n")
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: "closed"
            });
            await github.rest.issues.lock({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              lock_reason: "off-topic"
            });
